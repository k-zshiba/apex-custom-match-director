name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-amd64:
    name: Build Windows amd64 release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Go tests
        run: go test ./...

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Windows cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 zip

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Windows binary
        env:
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
        run: |
          wails build -clean -platform windows/amd64 -webview2 embed -tags native_webview2loader -o apex-custom-match-director.exe

      - name: Package release artifact
        run: |
          zip -j apex-custom-match-director-windows-amd64.zip \
            build/bin/apex-custom-match-director.exe \
            README.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            apex-custom-match-director-windows-amd64.zip \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag
